<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - MokshaYatra</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css">
    <style>
        .logo-container {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo-container img {
            width: 80px;
            height: 80px;
            margin-bottom: 10px;
        }
        
        .logo-container h1 {
            color: #8b0000;
            font-size: 2rem;
            margin: 0;
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 20px;
        }
        
        .forgot-password a {
            color: #666;
            text-decoration: none;
            font-size: 0.9rem;
        }
        
        .forgot-password a:hover {
            color: #8b0000;
        }
        
        .back-to-site {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        
        .back-to-site a {
            color: #8b0000;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
    </style>
</head>
<body>
    <div class="admin-container admin-login">
        <div class="logo-container">
            <img src="../assets/images/navbarlogo.png" alt="MokshaYatra Logo">
            <h1>MokshaYatra</h1>
            <p style="color: #666; margin-top: 5px;">Admin Panel</p>
        </div>
        
        <div class="login-header">
            <h2>Admin Login</h2>
            <p>Access the admin dashboard with your credentials</p>
        </div>
        
        <form class="login-form" id="admin-login-form">
            <div class="form-group">
                <label for="admin-email">Email Address</label>
                <input type="email" id="admin-email" name="email" 
                       placeholder="admin@mokshayatra.com" required>
            </div>
            
            <div class="form-group">
                <label for="admin-password">Password</label>
                <input type="password" id="admin-password" name="password" 
                       placeholder="Enter your password" required>
            </div>
            
            <div class="form-group">
                <button type="submit" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </div>
            
            <div class="login-error" id="login-error">
                Invalid email or password. Please try again.
            </div>
        </form>
        
        <div class="forgot-password">
            <a href="#">Forgot Password?</a>
        </div>
        
        <div class="back-to-site">
            <a href="../index.html">
                <i class="fas fa-arrow-left"></i> Back to Main Website
            </a>
        </div>
    </div>
    
    <!-- <script src="js/admin-panel.js"></script> -->
     <script src="../js/admin-panel.js"></script>

</body>
</html>
